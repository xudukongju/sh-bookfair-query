# Render 一键部署配置（仿「甜心小店」项目 方案 A）
# 本目录本身即一个独立 Git 仓库；推送到 GitHub 后：
# Render 用 GitHub 登录 → New+ → Web Service → 选仓库
# → Root Directory 留空（仓库根目录即本目录）→ Create。
# 免费计划注意：region 只能是 oregon；不要硬编码 PORT（Render 自动注入）；
# Auto-Deploy 默认关闭，创建后到 Settings → 设为 On Commit。
services:
  - type: web
    name: sh-bookfair
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: "echo no-build"
    startCommand: "node server.js"
    healthCheckPath: /
